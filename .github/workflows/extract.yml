name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'configcompany.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip -oq configcompany.zip -d /tmp/x
          rm -rf /tmp/x/configcompany/.github
          cp -a /tmp/x/configcompany/. .
          rm -f configcompany.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "extract configcompany.zip"
          git push
