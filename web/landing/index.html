<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ConfigCompany</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tx:#eceaff;--mu:#9a95c8;--gb:rgba(135,112,255,.28);--a1:#7b5cff;--a2:#4f7bff;--cy:#2bd3ff;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}body{margin:0;color:var(--tx);font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif;background:radial-gradient(700px 420px at 85% -5%,rgba(110,70,255,.45),transparent 70%),radial-gradient(500px 420px at 0 70%,rgba(60,50,200,.25),transparent 70%),#050312;min-height:100vh}
main{max-width:860px;margin:auto;padding:28px 18px}.logo{font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}.logo b{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--cy));display:grid;place-content:center}
h1{font-size:clamp(26px,6vw,42px);line-height:1.4;margin:36px 0 8px}.mu{color:var(--mu)}
a.btn{display:inline-block;margin:18px 8px 0 0;padding:12px 22px;border-radius:14px;font-weight:600;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 24px rgba(100,80,255,.45)}a.btn.s{background:rgba(86,62,230,.12);border:1px solid var(--gb);box-shadow:none}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:34px}.c{border:1px solid var(--gb);border-radius:20px;padding:18px;background:linear-gradient(160deg,rgba(110,84,255,.16),rgba(86,62,230,.06));backdrop-filter:blur(12px)}
.c b{font-size:17px}.p{font-size:22px;font-weight:800;margin-top:8px}footer{margin-top:48px;text-align:center;font-size:12.5px}
</style>
</head>
<body><main>
<div class="logo"><b>C</b>ConfigCompany</div>
<h1>اینترنت سریع و پایدار، با خرید و تمدید آسان در تلگرام</h1>
<div class="mu">ساخت اشتراک در چند ثانیه · پرداخت از کیف پول · پشتیبانی همیشگی</div>
<a class="btn" id="bot" href="#">ورود به ربات تلگرام</a><a class="btn s" href="/miniapp/">باز کردن فروشگاه</a>
<div class="g" id="plans"></div>
<footer class="mu">© ConfigCompany</footer>
</main>
<script>
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/public/config').then(r=>r.json()).then(c=>{if(c.bot)document.getElementById('bot').href='https://t.me/'+encodeURIComponent(c.bot)}).catch(()=>{});
fetch('/plans').then(r=>r.json()).then(p=>{document.getElementById('plans').innerHTML=p.map(x=>`<div class="c"><b>${esc(x.name)}</b><div class="p">${Number(x.price_month).toLocaleString('fa-IR')} <small class="mu">تومان / ماه</small></div><div class="mu">${x.traffic_gb?Number(x.traffic_gb).toLocaleString('fa-IR')+' گیگابایت':'حجم نامحدود'} · ${Number(x.devices).toLocaleString('fa-IR')} دستگاه</div></div>`).join('')}).catch(()=>{});
</script>
</body>
</html>
