<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ConfigCompany | پنل مدیریت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f3fb;--sf:#fff;--sf2:#efedfa;--bd:#dcd8f2;--tx:#17143a;--mu:#6c6a96;--a1:#6c4cf5;--a2:#3f6bf0;--cy:#0ea5d6;--ok:#12a566;--wr:#d98a1f;--er:#e23a58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07051a;--sf:#0e0a30;--sf2:#16114a;--bd:#2a2368;--tx:#eceaff;--mu:#9a95c8;--a1:#7b5cff;--a2:#4f7bff;--cy:#2bd3ff;--ok:#18c97c;--wr:#ff9a5c;--er:#ff4d6d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07051a;--sf:#0e0a30;--sf2:#16114a;--bd:#2a2368;--tx:#eceaff;--mu:#9a95c8;--a1:#7b5cff;--a2:#4f7bff;--cy:#2bd3ff;--ok:#18c97c;--wr:#ff9a5c;--er:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.7 Vazirmatn,Tahoma,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.app.c{grid-template-columns:64px 1fr}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sf);border-inline-end:1px solid var(--bd);padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:6px 8px 14px}.logo b{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--cy));display:grid;place-content:center;color:#fff;flex:none}
aside button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mu);padding:9px 10px;border-radius:10px;text-align:right;white-space:nowrap}
aside button:hover{background:var(--sf2)}aside button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.sec{font-size:11px;color:var(--mu);padding:12px 10px 2px}.c .sec,.c .lb,.c .logo span{display:none}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:0;z-index:4}
.pg{padding:18px 20px;max-width:1150px}h1{font-size:19px;margin:0}.mu{color:var(--mu);font-size:12.5px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.big{font-size:26px;font-weight:800;line-height:1.3}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:10px;padding:7px 13px;background:var(--sf);color:var(--tx);font-weight:600}
button:hover{background:var(--sf2)}button.p{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff}button.d{color:var(--er)}button.s{padding:4px 9px;font-size:12.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--a1);padding:0}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--bd);border-radius:14px;background:var(--sf)}
table{width:100%;border-collapse:collapse;min-width:640px}th{font-weight:600;color:var(--mu);font-size:12.5px;text-align:right;padding:10px 12px;background:var(--sf2)}td{padding:10px 12px;border-top:1px solid var(--bd);white-space:nowrap}tr.r{cursor:pointer}tr.r:hover td{background:var(--sf2)}
.bd{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;font-weight:600;border:1px solid}
.bd.a{color:var(--ok);border-color:var(--ok)}.bd.l{color:var(--wr);border-color:var(--wr)}.bd.e{color:var(--er);border-color:var(--er)}.bd.d{color:var(--mu);border-color:var(--bd)}.bd.h{color:var(--cy);border-color:var(--cy)}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--cy))}.bar.w i{background:var(--wr)}
.chips{display:flex;gap:6px;overflow-x:auto}.chips button{flex:none;padding:5px 12px;font-size:12.5px}.chips button.on{background:var(--a1);color:#fff;border-color:transparent}
.cht{display:flex;align-items:flex-end;gap:5px;height:160px;margin-top:12px}.cht i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--cy),var(--a1));min-height:4px}
.tg{width:44px;height:24px;padding:0;border-radius:99px;position:relative;flex:none}.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:inset-inline-start .2s}.tg.on{background:var(--a1);border-color:transparent}.tg.on::after{background:#fff;inset-inline-start:23px}
.li{padding:10px 0;border-top:1px solid var(--bd)}.li:first-child{border-top:0}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm label{display:grid;gap:4px;font-size:12.5px;color:var(--mu)}.fm .f{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(3,2,15,.6);display:grid;place-items:center;padding:16px;z-index:9}.dl{width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.bk{position:sticky;bottom:12px;margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--a1);color:#fff;box-shadow:0 10px 30px rgba(80,60,220,.4)}.bk button{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
#toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;max-width:420px;margin:auto;z-index:20}#toast.show{opacity:1}
@media (max-width:860px){.app,.app.c{grid-template-columns:1fr}aside{position:fixed;z-index:8;inset-block:0;inset-inline-start:0;width:230px;transform:translateX(100%);transition:transform .2s;height:100%}.app.o aside{transform:none}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.pg{padding:14px}.hd{padding:10px 14px}.c .sec,.c .lb,.c .logo span{display:revert}}
@media (min-width:861px){.mb{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="root"><aside id="side"></aside><div><div class="hd" id="hd"></div><div class="pg" id="app"></div></div></div>
<div id="dlg"></div><div id="toast" role="status"></div>
<script>
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR'),$=id=>document.getElementById(id),tg=window.Telegram&&window.Telegram.WebApp;
let TOKEN=localStorage.getItem('configcompany_admin')||'';
const S={tab:'dash',days:30,an:null,groups:[],offers:[],ct:[],me:null,ag:[],cf:-1,q:'',f:'all',st:null,users:[],plans:[],pays:[],o:0};
const IC={dash:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M21 20c0-2.5-1.5-4.5-4-5.3"/>',plans:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',pay:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/>',analytics:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',offers:'<path d="M20 12l-8 8-9-9V3h8z"/>',content:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',agents:'<path d="M4 20v-2a4 4 0 014-4h8a4 4 0 014 4v2M12 10a3 3 0 100-6 3 3 0 000 6z"/>',promo:'<path d="M20 12l-8 8-9-9V3h8zM7.5 7.5h.01"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${IC[n]}</svg>`;
const ALL=[['dash','داشبورد'],['users','کاربران'],['plans','پلن‌ها'],['pay','پرداخت‌ها'],['agents','نمایندگان'],['offers','تخفیف و پیشنهاد'],['promo','کد تخفیف و هدیه'],['content','محتوا'],['analytics','تحلیل فروش'],['settings','تنظیمات']];
const tabs=()=>S.me&&S.me.role=='agent'?ALL.filter(t=>['dash','users','pay','analytics'].includes(t[0])):ALL;
async function api(p,o={}){const r=await fetch(p,{method:o.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const d=j.detail;throw new Error(typeof d=='string'?d:'خطای سرور')}return j}
function toast(t){const e=$('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400)}
const date=d=>d?new Date(d+'Z').toLocaleDateString('fa-IR'):'—';
const status=u=>u.disabled?['d','غیرفعال']:!u.expires_at?['h','بدون اشتراک']:new Date(u.expires_at+'Z')<new Date()?['e','منقضی']:['a','فعال'];
const TB=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" class="mu">موردی نیست.</td></tr>`}</tbody></table></div>`;
async function run(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e.message)}await refresh()}
async function refresh(keep){
 if(S.tab=='dash'){S.st=await api('/admin/stats');S.me=await api('/admin/me')}
 if(S.tab=='analytics')S.an=await api('/admin/analytics?days='+S.days);
 if(S.tab=='offers'){S.groups=await api('/admin/discount-groups');S.offers=await api('/admin/offers');S.plans=await api('/admin/plans')}
 if(S.tab=='content')S.ct=await api('/admin/content');
 if(S.tab=='users'&&S.me&&S.me.role=='master')S.groups=await api('/admin/discount-groups');
 if(S.tab=='agents')S.ag=await api('/admin/agents');
 if(S.tab=='settings'){S.cfg=await api('/admin/settings');S.plans=await api('/admin/plans')}
 if(S.tab=='users'||S.tab=='plans'||S.tab=='pay')S.plans=await api('/admin/plans');
 if(S.tab=='users')S.users=await api(`/admin/users?q=${encodeURIComponent(S.q)}&status=${S.f}`);
 if(S.tab=='pay')S.pays=await api('/admin/payments?status=pending');
 go(keep)}
const pn=id=>(S.plans.find(p=>p.id==id)||{}).name||'—';
const V={
dash:()=>`<h1>داشبورد</h1><div class="g4">${[['کل کاربران',S.st.users],['اشتراک فعال',S.st.active],['فروش امروز',fa(S.st.sales_today)+' <small class="mu">تومان</small>'],['پرداخت در انتظار',S.st.pending_payments]].map(c=>`<div class="card"><div class="mu">${c[0]}</div><div class="big">${typeof c[1]=='number'?fa(c[1]):c[1]}</div></div>`).join('')}</div>${S.me.role=='agent'?`<div class="card row"><span>موجودی شما</span><b>${fa(S.me.balance)} تومان</b></div><div class="mu" style="margin-top:8px">تخفیف عمده‌فروشی شما: ${fa(S.me.discount_percent)}٪ · ساخت و تمدید کاربر از موجودی شما کسر می‌شود.</div>`:`<div class="mu">نودها، Hostها و Core را از خود پنل Remnawave/PasarGuard مدیریت کنید؛ این پنل بخش فروش را کنترل می‌کند.</div>`}`,
users:()=>`<div class="row"><h1>کاربران</h1><button class="p" onclick="dlgUser()">+ ساخت کاربر</button></div><div class="row" style="margin-top:12px;gap:8px"><input id="q" value="${S.q}" placeholder="جستجو…" aria-label="جستجو" oninput="S.q=this.value;clearTimeout(S.t);S.t=setTimeout(()=>refresh(1),300)" style="max-width:300px"><div class="chips">${[['all','همه'],['active','فعال'],['expired','منقضی'],['disabled','غیرفعال']].map(c=>`<button class="${S.f==c[0]?'on':''}" onclick="S.f='${c[0]}';refresh()">${c[1]}</button>`).join('')}</div></div>
${TB(['کاربر','پلن','وضعیت','انقضا','موجودی','عملیات'],S.users.map(u=>{const s=status(u);return`<tr><td><b>${esc(u.name||'—')}</b> <span class="mu" dir="ltr">${esc(u.username?'@'+u.username:u.tg_id)}</span></td><td>${pn(u.plan_id)}</td><td><span class="bd ${s[0]}">${s[1]}</span></td><td>${date(u.expires_at)}</td><td>${fa(u.balance)}</td><td><button class="s" onclick="run(()=>api('/admin/users/${u.id}',{method:'PATCH',body:{add_days:30}}),'۳۰ روز اضافه شد')">+۳۰ روز</button> <button class="s" onclick="run(()=>api('/admin/users/${u.id}',{method:'PATCH',body:{reset_usage:true}}),'مصرف صفر شد')">ریست</button> <button class="s ${u.disabled?'':'d'}" onclick="run(()=>api('/admin/users/${u.id}',{method:'PATCH',body:{disabled:${!u.disabled}}}),'انجام شد')">${u.disabled?'فعال‌سازی':'غیرفعال'}</button> <button class="s" onclick="copyL('${u.sub_url||''}')">لینک</button>${S.me.role=='master'?` <button class="s" onclick="dlgUG(${u.id})">گروه</button>`:''} <button class="s d" onclick="delU(${u.id})">${S.cf==u.id?'مطمئنید؟':'حذف'}</button></td></tr>`}).join(''))}`,
plans:()=>`<div class="row"><h1>پلن‌ها</h1><button class="p" onclick="dlg(-1)">+ پلن جدید</button></div>${TB(['نام','قیمت ماهانه','حجم','دستگاه','فعال',''],S.plans.map((p,i)=>`<tr><td><b>${p.name}</b></td><td>${fa(p.price_month)}</td><td>${p.traffic_gb?fa(p.traffic_gb)+' GB':'نامحدود'}</td><td>${fa(p.devices)}</td><td><button class="tg ${p.active?'on':''}" role="switch" aria-checked="${p.active}" onclick="run(()=>api('/admin/plans/${p.id}',{method:'PUT',body:{name:'${p.name}',price_month:${p.price_month},traffic_gb:${p.traffic_gb},devices:${p.devices},active:${!p.active}}}))"></button></td><td><button class="s" onclick="dlg(${i})">ویرایش</button></td></tr>`).join(''))}`,
pay:()=>`<h1>پرداخت‌های در انتظار</h1>${TB(['شناسه','کاربر','مبلغ','روش','شماره پیگیری','عملیات'],S.pays.map(p=>`<tr><td>#${fa(p.id)}</td><td>${fa(p.user_id)}</td><td><b>${fa(p.amount)}</b></td><td>${p.method}</td><td dir="ltr">${esc(p.receipt||'—')}</td><td><button class="s p" onclick="run(()=>api('/admin/payments/${p.id}/approve',{method:'POST'}),'تأیید شد و کیف پول شارژ شد')">تأیید</button> <button class="s d" onclick="run(()=>api('/admin/payments/${p.id}/reject',{method:'POST'}),'رد شد')">رد</button></td></tr>`).join(''))}`,
promo:()=>`<h1>کد تخفیف و هدیه</h1><div class="g2" style="margin-top:14px"><div class="card fm"><b class="f">کد تخفیف جدید</b><label>کد<input id="cc" dir="ltr"></label><label>درصد<input id="cpc" type="number" value="10"></label><label class="f">حداکثر استفاده (۰ = نامحدود)<input id="cm" type="number" value="0"></label><button class="p f" onclick="run(()=>api('/admin/coupons',{method:'POST',body:{code:$('cc').value,percent:+$('cpc').value,max_uses:+$('cm').value}}),'کد تخفیف ساخته شد')">ساخت</button></div>
<div class="card fm"><b class="f">کد هدیه جدید</b><label>کد<input id="gc" dir="ltr"></label><label>مبلغ (تومان)<input id="ga" type="number" value="50000"></label><button class="p f" onclick="run(()=>api('/admin/gift-codes',{method:'POST',body:{code:$('gc').value,amount:+$('ga').value}}),'کد هدیه ساخته شد')">ساخت</button></div></div>`};
const sub_=u=>u.disabled?'':'';
const sel=k=>`<select id="c_${k}"><option value="1" ${S.cfg[k]=='1'?'selected':''}>روشن</option><option value="0" ${S.cfg[k]=='0'?'selected':''}>خاموش</option></select>`;
V.settings=()=>{const c=S.cfg;return`<h1>تنظیمات فروش</h1>
<div class="card fm" style="margin-top:14px"><b class="f">دسترسی موقت (Grace)</b><label>وضعیت<select id="c_grace_enabled"><option value="1" ${c.grace_enabled=='1'?'selected':''}>فعال</option><option value="0" ${c.grace_enabled=='0'?'selected':''}>غیرفعال</option></select></label><label>مدت (روز)<input id="c_grace_days" type="number" value="${c.grace_days}"></label><div class="f mu">کاربر منقضی‌شده می‌تواند یک بار تا زمان تمدید، چند روز دسترسی موقت بگیرد؛ با خرید بعدی دوباره فعال می‌شود.</div></div>
<div class="card fm" style="margin-top:12px"><b class="f">تبدیل خودکار تست به خرید</b><label>پلن<select id="c_trial_convert_plan_id"><option value="0">غیرفعال</option>${S.plans.filter(p=>p.active).map(p=>`<option value="${p.id}" ${c.trial_convert_plan_id==p.id?'selected':''}>${p.name}</option>`).join('')}</select></label><label>مدت (ماه)<input id="c_trial_convert_months" type="number" value="${c.trial_convert_months}"></label><div class="f mu">وقتی تست تمام شد و موجودی کیف پول کافی بود، پلن انتخابی خودکار خریداری می‌شود؛ در غیر این صورت فقط یادآوری می‌رود.</div></div>
<div class="card fm" style="margin-top:12px"><b class="f">رفرال چندسطحی</b><label>سطح ۲ (٪)<input id="c_ref_l2" type="number" value="${c.ref_l2}"></label><label>سطح ۳ (٪)<input id="c_ref_l3" type="number" value="${c.ref_l3}"></label><div class="f mu">سطح ۱ پلکانی است (۸/۱۲/۱۸٪ بر اساس تعداد دعوت) و در کد تنظیم می‌شود.</div></div>
<div class="card fm" style="margin-top:12px"><b class="f">حالت تعمیر</b><label>وضعیت دستی<select id="c_maintenance"><option value="0" ${c.maintenance=='0'?'selected':''}>خاموش</option><option value="1" ${c.maintenance=='1'?'selected':''}>روشن</option></select></label><div class="f mu">در حالت تعمیر، خرید/شارژ/تست برای کاربران بسته می‌شود. اگر پنل ۲ بار پیاپی در دسترس نباشد، حالت تعمیر خودکار فعال و بعد از برگشت پنل برداشته می‌شود.</div></div>
<div class="card fm" style="margin-top:12px"><b class="f">اعلان‌های مدیر (تلگرام)</b><label>پرداخت جدید<span>${sel('notify_payment')}</span></label><label>کاربر جدید<span>${sel('notify_new_user')}</span></label><label>قطع/وصل پنل<span>${sel('notify_panel')}</span></label><label>مصرف غیرعادی<span>${sel('notify_anomaly')}</span></label><label class="f">آستانه مصرف غیرعادی (GB بین دو بررسی ۳۰ دقیقه‌ای)<input id="c_anomaly_gb" type="number" value="${c.anomaly_gb}"></label></div>
<div class="card fm" style="margin-top:12px"><b class="f">بکاپ خودکار دیتابیس</b><label>وضعیت<span>${sel('backup_enabled')}</span></label><label>ساعت (UTC، ۰ تا ۲۳)<input id="c_backup_hour" type="number" min="0" max="23" value="${c.backup_hour}"></label><div class="f mu">فایل بکاپ روزانه به پیام خصوصی مدیران در تلگرام ارسال می‌شود.</div><button class="f" onclick="run(()=>api('/admin/backup',{method:'POST'}),'بکاپ به تلگرام ارسال شد')">بکاپ همین حالا</button></div>
<button class="p" style="margin-top:14px" onclick="saveCfg()">ذخیره تنظیمات</button>`};
function saveCfg(){const b={};['grace_enabled','grace_days','trial_convert_plan_id','trial_convert_months','ref_l2','ref_l3','maintenance','notify_payment','notify_new_user','notify_panel','notify_anomaly','anomaly_gb','backup_enabled','backup_hour'].forEach(k=>b[k]=String($('c_'+k).value));run(()=>api('/admin/settings',{method:'PUT',body:b}),'تنظیمات ذخیره شد')}
V.analytics=()=>{const a=S.an,m=Math.max(1,...a.daily.map(d=>d.revenue));return`<h1>تحلیل فروش</h1><div class="chips" style="margin-top:12px">${[7,30,90].map(d=>`<button class="${S.days==d?'on':''}" onclick="S.days=${d};refresh()">${fa(d)} روز</button>`).join('')}</div><div class="g4" style="margin-top:12px">${[['درآمد',fa(a.revenue)+' تومان'],['سفارش',fa(a.orders)],['کاربر جدید',fa(a.new_users)],['ARPU',fa(a.arpu)+' تومان']].map(c=>`<div class="card"><div class="mu">${c[0]}</div><div class="big" style="font-size:20px">${c[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><b>درآمد روزانه</b><div class="cht">${a.daily.map(d=>`<i style="height:${d.revenue/m*100}%" title="${d.date}: ${fa(d.revenue)}"></i>`).join('')}</div></div>${TB(['پلن','سفارش','درآمد'],a.top_plans.map(p=>`<tr><td>${esc(p.name)}</td><td>${fa(p.orders)}</td><td>${fa(p.revenue)}</td></tr>`).join(''))}<div class="mu" style="margin-top:8px">تبدیل: ${fa(a.conversion)}٪ · شارژ کیف پول: ${fa(a.topups)} · پاداش رفرال: ${fa(a.referral_paid)}</div>`};
V.offers=()=>`<div class="row"><h1>تخفیف و پیشنهاد ویژه</h1><div><button onclick="dlgGroup()">+ گروه</button> <button class="p" onclick="dlgOffer()">+ پیشنهاد</button></div></div><h2 style="margin-top:14px">گروه‌های تخفیف</h2>${TB(['نام','درصد','کاربران','فعال'],S.groups.map(g=>`<tr><td>${esc(g.name)}</td><td>${fa(g.percent)}٪</td><td>${fa(g.users)}</td><td><button class="tg ${g.active?'on':''}" role="switch" aria-checked="${g.active}" onclick="run(()=>api('/admin/discount-groups/${g.id}',{method:'PUT',body:{name:'${esc(g.name)}',percent:${g.percent},active:${!g.active}}}))"></button></td></tr>`).join(''))}<h2 style="margin-top:14px">پیشنهادهای ویژه</h2>${TB(['عنوان','درصد','مخاطب','پایان','فعال',''],S.offers.map(o=>`<tr><td>${esc(o.title)}</td><td>${fa(o.percent)}٪</td><td>${{all:'همه',expired:'منقضی‌ها',new:'کاربران جدید'}[o.audience]}</td><td>${date(o.ends_at)}</td><td><button class="tg ${o.active?'on':''}" role="switch" aria-checked="${o.active}" onclick="run(()=>api('/admin/offers/${o.id}',{method:'PATCH',body:{active:${!o.active}}}))"></button></td><td><button class="s" onclick="run(async()=>{const r=await api('/admin/offers/${o.id}/announce',{method:'POST'});toast('ارسال برای '+r.recipients+' نفر شروع شد')})">ارسال به کاربران</button> <button class="s d" onclick="run(()=>api('/admin/offers/${o.id}',{method:'DELETE'}),'حذف شد')">حذف</button></td></tr>`).join(''))}<div class="mu" style="margin-top:8px">تخفیف نهایی = بیشترینِ (گروه کاربر، پیشنهاد فعال) و روی آن کد تخفیف هم اعمال می‌شود.</div>`;
V.content=()=>`<div class="row"><h1>محتوا</h1><button class="p" onclick="dlgContent(-1)">+ مورد جدید</button></div>${TB(['نوع','عنوان','ترتیب','فعال',''],S.ct.map((c,i)=>`<tr><td>${{faq:'سؤال متداول',rules:'قوانین',privacy:'حریم خصوصی',welcome:'خوش‌آمد',news:'اخبار'}[c.kind]}</td><td>${esc(c.title)}</td><td>${fa(c.sort)}</td><td>${c.active?'✓':'—'}</td><td><button class="s" onclick="dlgContent(${i})">ویرایش</button> <button class="s d" onclick="run(()=>api('/admin/content/${c.id}',{method:'DELETE'}),'حذف شد')">حذف</button></td></tr>`).join(''))}<div class="mu" style="margin-top:8px">در متن «خوش‌آمد» می‌توانید {name} بگذارید. اخبار روی صفحه‌ی اصلی مینی‌اپ دیده می‌شود.</div>`;
function dlgGroup(){modal('گروه تخفیف جدید',`<div class="fm" style="margin-top:14px"><label class="f">نام<input id="gn"></label><label class="f">درصد تخفیف<input id="gp" type="number" value="10"></label></div><button class="p" style="margin-top:14px" onclick="const b={name:$('gn').value,percent:+$('gp').value,active:true};closeDlg();run(()=>api('/admin/discount-groups',{method:'POST',body:b}),'گروه ساخته شد')">ساخت</button>`)}
function dlgOffer(){modal('پیشنهاد ویژه جدید',`<div class="fm" style="margin-top:14px"><label class="f">عنوان<input id="ot"></label><label>پلن<select id="op"><option value="">همه</option>${S.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>مخاطب<select id="oa"><option value="all">همه</option><option value="expired">منقضی‌ها</option><option value="new">کاربران جدید</option></select></label><label>درصد<input id="ox" type="number" value="20"></label><label>مدت (روز)<input id="od" type="number" value="7"></label></div><button class="p" style="margin-top:14px" onclick="const b={title:$('ot').value,plan_id:$('op').value?+$('op').value:null,audience:$('oa').value,percent:+$('ox').value,days:+$('od').value};closeDlg();run(()=>api('/admin/offers',{method:'POST',body:b}),'پیشنهاد ساخته شد')">ساخت</button>`)}
function dlgUG(uid){modal('گروه تخفیف کاربر',`<label class="fm" style="margin-top:14px"><span class="mu">گروه</span><select id="ug2"><option value="0">بدون گروه</option>${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)} (${fa(g.percent)}٪)</option>`).join('')}</select></label><button class="p" style="margin-top:14px" onclick="const v=+$('ug2').value;closeDlg();run(()=>api('/admin/users/${uid}',{method:'PATCH',body:{discount_group_id:v}}),'ذخیره شد')">ذخیره</button>`)}
function dlgContent(i){const c=i<0?{kind:'faq',title:'',body:'',sort:0,active:true}:S.ct[i];modal(i<0?'مورد جدید':'ویرایش',`<div class="fm" style="margin-top:14px"><label>نوع<select id="ck">${[['faq','سؤال متداول'],['rules','قوانین'],['privacy','حریم خصوصی'],['welcome','خوش‌آمد'],['news','اخبار']].map(k=>`<option value="${k[0]}" ${c.kind==k[0]?'selected':''}>${k[1]}</option>`).join('')}</select></label><label>ترتیب<input id="cs" type="number" value="${c.sort}"></label><label class="f">عنوان<input id="ct" value="${esc(c.title)}"></label><label class="f">متن<textarea id="cb" rows="6">${esc(c.body)}</textarea></label><label class="f">وضعیت<select id="ca"><option value="1" ${c.active?'selected':''}>فعال</option><option value="0" ${c.active?'':'selected'}>غیرفعال</option></select></label></div><button class="p" style="margin-top:14px" onclick="const b={kind:$('ck').value,title:$('ct').value,body:$('cb').value,sort:+$('cs').value,active:$('ca').value=='1'};closeDlg();run(()=>${i<0?"api('/admin/content',{method:'POST',body:b})":`api('/admin/content/${c.id}',{method:'PUT',body:b})`},'ذخیره شد')">ذخیره</button>`)}
function copyL(t){if(!t)return toast('لینکی وجود ندارد');try{navigator.clipboard.writeText(t)}catch(e){}toast('لینک کپی شد')}
function delU(id){if(S.cf==id){S.cf=-1;run(()=>api('/admin/users/'+id,{method:'DELETE'}),'کاربر حذف شد')}else{S.cf=id;go()}}
const closeDlg=()=>{$('dlg').innerHTML=''};
const modal=(t,body)=>{$('dlg').innerHTML=`<div class="ov" onclick="if(event.target==this)closeDlg()"><div class="card dl" role="dialog" aria-modal="true"><div class="row"><h1>${t}</h1><button class="s" onclick="closeDlg()">✕</button></div>${body}</div></div>`};
function dlgUser(){const ag=S.me.role=='agent';modal('ساخت کاربر جدید',`<div class="fm" style="margin-top:14px"><label class="f">نام / برچسب<input id="un"></label><label class="f">پلن<select id="up">${S.plans.filter(p=>p.active).map(p=>`<option value="${p.id}">${p.name} — ${fa(ag?p.agent_price:p.price_month)} تومان/ماه</option>`).join('')}</select></label><label>مدت (روز)<input id="ud" type="number" value="30"></label>${ag?'':'<label>حجم (GB، خالی = طبق پلن)<input id="ug" type="number"></label>'}</div>${ag?'<div class="mu" style="margin-top:8px">هزینه با قیمت عمده از موجودی شما کسر می‌شود.</div>':''}<button class="p" style="margin-top:14px" onclick="mkUser()">ساخت</button>`)}
async function mkUser(){const g=$('ug');try{const r=await api('/admin/users',{method:'POST',body:{name:$('un').value,plan_id:+$('up').value,days:+$('ud').value,traffic_gb:g&&g.value!==''?+g.value:null}});modal('کاربر ساخته شد',`<div class="mu" style="margin:10px 0">لینک اشتراک را برای مشتری بفرستید:</div><input readonly dir="ltr" value="${r.sub_url}"><button class="p" style="margin-top:10px" onclick="copyL('${r.sub_url}')">کپی لینک</button>`);S.tab='users';await refresh()}catch(e){toast(e.message)}}
V.agents=()=>`<div class="row"><h1>نمایندگان</h1><button class="p" onclick="dlgAgent()">+ نماینده جدید</button></div>${TB(['نماینده','ربات','تخفیف عمده','کمیسیون','موجودی','مشتریان','فعال',''],S.ag.map(a=>`<tr><td><b>${esc(a.name)}</b> <span class="mu" dir="ltr">${a.tg_id}</span></td><td dir="ltr">${esc(a.bot_username?'@'+a.bot_username:'—')}</td><td>${fa(a.discount_percent)}٪</td><td>${fa(a.commission_percent)}٪</td><td>${fa(a.balance)}</td><td>${fa(a.users)}</td><td><button class="tg ${a.active?'on':''}" role="switch" aria-checked="${a.active}" onclick="run(()=>api('/admin/agents/${a.id}',{method:'PATCH',body:{active:${!a.active}}}))"></button></td><td><button class="s" onclick="dlgBal(${a.id})">شارژ</button></td></tr>`).join(''))}<div class="mu" style="margin-top:10px">هر نماینده ربات جدا دارد؛ مشتریان آن ربات فقط برای همان نماینده دیده می‌شوند. تخفیف عمده برای ساخت/تمدید دستی از موجودی نماینده، و کمیسیون برای خرید مشتریان ربات او اعمال می‌شود.</div>`;
function dlgAgent(){modal('نماینده جدید',`<div class="fm" style="margin-top:14px"><label>شناسه تلگرام نماینده<input id="at" type="number" dir="ltr"></label><label>نام<input id="an"></label><label class="f">توکن ربات نماینده (اختیاری)<input id="ak" dir="ltr"></label><label class="f">یوزرنیم پشتیبانی (اختیاری)<input id="as" dir="ltr"></label><label>تخفیف عمده ٪<input id="ad" type="number" value="20"></label><label>کمیسیون ٪<input id="ac" type="number" value="10"></label><label class="f">شارژ اولیه (تومان)<input id="ab" type="number" value="0"></label></div><button class="p" style="margin-top:14px" onclick="mkAgent()">ساخت نماینده</button>`)}
function mkAgent(){const b={tg_id:+$('at').value,name:$('an').value,bot_token:$('ak').value.trim()||null,support_username:$('as').value.trim()||null,discount_percent:+$('ad').value,commission_percent:+$('ac').value,balance:+$('ab').value};closeDlg();run(()=>api('/admin/agents',{method:'POST',body:b}),'نماینده ساخته شد')}
function dlgBal(id){modal('شارژ موجودی نماینده',`<label class="fm" style="margin-top:14px"><span class="mu">مبلغ (تومان)</span><input id="bv" type="number"></label><button class="p" style="margin-top:14px" onclick="const v=+$('bv').value;closeDlg();run(()=>api('/admin/agents/${id}',{method:'PATCH',body:{add_balance:v}}),'موجودی شارژ شد')">شارژ</button>`)}
function dlg(i){const p=i<0?{name:'',price_month:99000,traffic_gb:50,devices:2,active:true}:S.plans[i];$('dlg').innerHTML=`<div class="ov" onclick="if(event.target==this)this.remove()"><div class="card dl" role="dialog" aria-modal="true"><h1>${i<0?'پلن جدید':'ویرایش پلن'}</h1><div class="fm" style="margin-top:14px"><label class="f">نام<input id="pn" value="${p.name}"></label><label>قیمت ماهانه (تومان)<input id="pp" type="number" value="${p.price_month}"></label><label>حجم (GB، ۰ = نامحدود)<input id="pt" type="number" value="${p.traffic_gb}"></label><label>تعداد دستگاه<input id="pd" type="number" value="${p.devices}"></label></div><button class="p" style="margin-top:14px" onclick="savePlan(${i<0?-1:p.id})">ذخیره</button></div></div>`}
function savePlan(id){const b={name:$('pn').value,price_month:+$('pp').value,traffic_gb:+$('pt').value,devices:+$('pd').value,active:true};$('dlg').innerHTML='';run(()=>id<0?api('/admin/plans',{method:'POST',body:b}):api('/admin/plans/'+id,{method:'PUT',body:b}),'ذخیره شد')}
function go(keep){$('root').className='app'+(S.o?' o':'');
$('side').innerHTML=`<div class="logo"><b>C</b><span>ConfigCompany</span></div>`+tabs().map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';S.o=0;refresh()">${ic(t[0]=='plans'?'plans':t[0]=='promo'?'promo':t[0])}<span class="lb">${t[1]}</span></button>`).join('');
$('hd').innerHTML=`<button class="s mb" aria-label="منو" onclick="S.o=!S.o;go()">${ic('menu')}</button><span class="mu" style="flex:1">${esc(S.me?S.me.name:'')}</span><button class="s" onclick="localStorage.removeItem('configcompany_admin');location.reload()">خروج</button>`;
$('app').innerHTML=V[S.tab]();if(keep){const q=$('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
function loginForm(msg){$('app').innerHTML=`<div class="card fm" style="max-width:420px;margin:40px auto"><h1 class="f">ورود مدیر</h1><div class="mu f">${msg||'توکن مدیر را وارد کنید (ساخت: python -m app.cli token &lt;tg_id&gt;) یا پنل را از داخل تلگرام باز کنید.'}</div><input class="f" id="tk" dir="ltr" placeholder="Token" aria-label="توکن"><button class="p f" onclick="TOKEN=$('tk').value.trim();localStorage.setItem('configcompany_admin',TOKEN);boot()">ورود</button></div>`}
async function boot(){try{if(!TOKEN&&tg&&tg.initData){TOKEN=(await (await fetch('/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})})).json()).token}
if(!TOKEN)return loginForm();await api('/admin/stats');S.me=await api('/admin/me');await refresh()}catch(e){TOKEN='';localStorage.removeItem('configcompany_admin');loginForm(e.message)}}
boot();
</script>
</body>
</html>
