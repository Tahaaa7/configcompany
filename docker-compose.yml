services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: configcompany
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: configcompany
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configcompany -d configcompany"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 18
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
